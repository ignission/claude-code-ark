<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>リンクを押すと行が光るまで</title>
<style>
  .pg { border: 1px solid #22304a; border-radius: 10px; background: #101827; padding: 1rem 1.1rem 1.2rem; }
  .pg h2 { margin: 0 0 .9rem; font-size: 1.05rem; line-height: 1.45; }
  .pg h2 .key { color: #7dd3fc; }
  .lane { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: .5rem; align-items: center; }
  .box { border: 1px solid #33445f; border-radius: 8px; background: #141d2e; padding: .6rem .55rem; text-align: center;
         font: 700 .72rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .box small { display: block; margin-top: .25rem; font: .62rem/1.4 system-ui, sans-serif; color: #8391a7; }
  .box.key { border-color: #7dd3fc; color: #7dd3fc; }
  .to { color: #8391a7; font-size: .95rem; }
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1rem; }
  .chip { padding: .18rem .6rem; border-radius: 999px; font-size: .7rem; font-weight: 700; }
  .ok { background: rgba(74, 222, 128, .14); color: #4ade80; }
  .ng { background: rgba(248, 113, 113, .14); color: #f87171; }
  .hrefs { margin: 0; padding: 0; list-style: none; font: .74rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
  .hrefs li { display: flex; justify-content: space-between; gap: .8rem; padding: .4rem .2rem; border-top: 1px solid #1c2740; }
  .hrefs li:first-child { border-top: 0; }
</style>
</head>
<body>
<script type="application/json" id="ark-diagram-model">
{
  "version": 1,
  "type": "deck",
  "title": "リンクを押すと行が光るまで",
  "nodes": [],
  "edges": [],
  "groups": [],
  "ext": {
    "pages": [
      { "id": "p-result", "type": "html", "title": "結論" },
      {
        "id": "p-seq",
        "type": "sequence",
        "title": "クリックから行のハイライトまで",
        "nodes": [
          { "id": "iframe", "label": "board iframe" },
          { "id": "layer", "label": "link layer", "kind": "new" },
          { "id": "parent", "label": "parent window" },
          { "id": "viewer", "label": "file viewer" }
        ],
        "edges": [
          { "id": "s1", "from": "iframe", "to": "layer", "label": "click a[href=\"…#L33-L48\"]" },
          { "id": "s2", "from": "layer", "to": "layer", "label": "preventDefault()",
            "ext": { "source": "packages/server/src/lib/diagram-link-layer.ts#L33-L48" } },
          { "id": "s3", "from": "layer", "to": "parent", "label": "postMessage(href)",
            "ext": { "style": "async" } },
          { "id": "s4", "from": "parent", "to": "parent", "label": "parseDiagramLinkHref(href)" },
          { "id": "s5", "from": "parent", "to": "viewer", "label": "openFileTab(path,33,48)" },
          { "id": "s6", "from": "viewer", "to": "iframe", "label": "33〜48 行が光る",
            "ext": { "style": "return" } }
        ]
      },
      {
        "id": "p-tree",
        "type": "call-tree",
        "title": "変更した経路",
        "nodes": [
          { "id": "t-doc", "label": "board doc", "ext": { "note": "コードを指す語をリンクで書く" } },
          { "id": "t-layer", "label": "diagram-link-layer.ts", "kind": "added",
            "ext": { "source": "packages/server/src/lib/diagram-link-layer.ts#L33-L48",
                     "added": 96, "removed": 0, "note": "遷移を止め href を渡す" } },
          { "id": "t-pane", "label": "DiagramPane.tsx",
            "ext": { "added": 87, "removed": 0, "via": "callback",
                     "note": "parseDiagramLinkHref で .. と絶対パスを弾く" } },
          { "id": "t-tabs", "label": "useViewerTabs.ts",
            "ext": { "added": 6, "removed": 0, "note": "既存の ark:open-file に相乗り" } }
        ],
        "edges": [
          { "id": "e1", "from": "t-doc", "to": "t-layer" },
          { "id": "e2", "from": "t-layer", "to": "t-pane" },
          { "id": "e3", "from": "t-pane", "to": "t-tabs" }
        ]
      },
      { "id": "p-guard", "type": "html", "title": "弾く href" }
    ]
  }
}
</script>

<section class="pg" data-ark-page="p-result">
  <h2>リンクは <span class="key">親の window</span> で解釈する</h2>
  <div class="lane">
    <div class="box">board iframe<small>遷移を止めて href を渡すだけ</small></div>
    <div class="to">→</div>
    <div class="box key">parent window<small>パスを検査して開く</small></div>
    <div class="to">→</div>
    <div class="box">file viewer<small>該当行を光らせる</small></div>
  </div>
  <div class="chips">
    <span class="chip ok">✓ iframe から直接ファイルを開かない</span>
    <span class="chip ok">✓ worktree の外へは出ない</span>
  </div>
</section>

<section class="pg" data-ark-page="p-guard">
  <h2>worktree 相対パスだけを <span class="key">開く</span></h2>
  <ul class="hrefs">
    <li><span>src/foo.ts#L10-L24</span><span class="chip ok">✓ ファイルビューア</span></li>
    <li><span>https://example.com</span><span class="chip ok">✓ 新しいタブ</span></li>
    <li><span>../secret.txt</span><span class="chip ng">✕ 開かない</span></li>
    <li><span>/etc/passwd</span><span class="chip ng">✕ 開かない</span></li>
  </ul>
</section>
</body>
</html>
