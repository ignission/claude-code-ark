name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check

      # ユニットテスト（server / shared / web の *.test.ts をルート vitest 設定で一括実行）。
      # 以前は CI にテストの step が無く、意味差分の契約を変えた #289 が
      # e2e を 4 件壊したまま緑で通っていた。ここで落ちるようにする。
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # clone した直後に scripts/start.sh の1コマンドで起動するかを見る。
  # pnpm を入れずに始め、スクリプトが自分で調達する経路を通す。Node は記載の下限の系列で動かす。
  # ubuntu は ttyd を入れず、Ark が自分で取得する経路を通す。macOS には公式バイナリが無いので brew で入れる。
  start-script:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux and ttyd (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux ttyd

      - name: Start Ark with scripts/start.sh
        run: bash scripts/smoke-start.sh
