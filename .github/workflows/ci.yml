name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm check

      # ユニットテスト（server / shared / web の *.test.ts をルート vitest 設定で一括実行）。
      # 以前は CI にテストの step が無く、意味差分の契約を変えた #289 が
      # e2e を 4 件壊したまま緑で通っていた。ここで落ちるようにする。
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # npm パッケージ (`npx claude-code-ark`) を利用者と同じ入れ方で入れ、起動するかを見る。
  # 公開物に入れ忘れたファイルや依存は、型検査とユニットテストでは見つからない。
  npm-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack npm package
        run: node scripts/pack-npm.mjs

      - name: Smoke test
        run: bash scripts/smoke-npm.sh
