name: release

# tag push (v*.*.*) で .app をビルドし、GitHub Releases に upload する。
# 別 repo (`<user>/homebrew-tap`) の Caskfile も自動更新する (要 HOMEBREW_TAP_TOKEN)。
#
# 前提:
#   - F4 (build-bin) で tmux/ttyd の artifact が揃っている (現状未生成のため
#     skip 可能な構造にしている)
#   - F5 (Claude CLI loader) は未実装。.app 単体で動作する状態を想定
#   - F0:B-1 確定済み: Apple Developer 登録なし (未署名配布)
#
# 実 release tag を打つのは F4-F6 完了後。それまでは手動 (workflow_dispatch) で
# 動作確認のみ実施する想定。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch or commit SHA). Tag を打つ前のドライラン用。"
        required: false
        default: ""
        type: string
      tag:
        description: "Release tag for upload (e.g. v0.1.0)。指定すると Release を作成・上書き、空ならドライラン (artifact のみ作成、upload skip)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build .app (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # push (tag) trigger: GITHUB_REF (refs/tags/...) が tag を指す → そのまま
          # workflow_dispatch: inputs.ref があれば branch/SHA、なければ caller ref。
          # inputs.tag を ref にしない (まだ存在しない可能性がある)。
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify tag matches package version
        # tag 経由の release で artifact 名 (Ark-<package.json.version>-arm64.zip) と
        # tag (v<X.Y.Z>) がずれると Cask の url / sha256 が解決できなくなるため、
        # 一致しない場合は build 前に fail させる。dry-run (inputs.tag 空) は skip。
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # v 接頭辞を取り除いた値を semver として扱う
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Tag (${TAG} → ${TAG_VERSION}) does not match packages/desktop/package.json version (${PKG_VERSION})."
            echo "::error::Bump packages/desktop/package.json version to ${TAG_VERSION} (or push the matching tag) before releasing."
            exit 1
          fi
          echo "::notice::Tag ${TAG} matches package version ${PKG_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      # F4 (build-bin.yml) の artifact から tmux/ttyd を取得する想定。
      # build-bin.yml は現状 workflow_dispatch 限定で artifact 未生成のため、
      # 取得失敗時も build を継続できる構造 (continue-on-error) にしている。
      # F4 完了後に actions/download-artifact@v4 で取得する形に書き換える。
      #
      # - name: Download tmux/ttyd artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: ark-bin-macos-arm64
      #     path: packages/desktop/build-assets
      #   continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + server + desktop
        run: pnpm -r build

      - name: Package .app (arm64 zip)
        env:
          # F0:B-1 確定: 未署名配布 (Apple Developer 登録なし)。
          # electron-builder の auto signing を無効化し、identity 探索をスキップする。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # target は electron-builder.yml の mac.target で dmg + zip を定義済み。
        # arch は CLI フラグ (--arm64) で渡す (electron-builder 25 の慣例的な指定)。
        # 旧コマンドは末尾に `zip` を位置引数として渡していたが、electron-builder 25 の
        # yargs は target 名を位置引数で受けず `Unknown argument: zip` で exit 1 する。
        # zip 成果物の欠落は下流 `Compute artifact metadata` step が
        # `ls packages/desktop/release/Ark-*-arm64.zip` で検出して fail する。
        run: pnpm --filter @ark/desktop exec electron-builder --mac --arm64

      - name: Smoke test .app bootstrap
        # PR #180 で fix した 2 系統のバグの regression を tag release 前に検知する:
        #   1. `Dynamic require of "electron" is not supported` (build.mjs banner 欠落) →
        #      bootstrap で main.js が throw、server.listen に到達できないので
        #      下記の "Ark server running" ログが出ない → step が exit 1
        #   2. 同梱 claude バイナリの asarUnpack 配置ずれ・実行権限欠落 → 次 step で検知
        # ヘルスチェック target は HTTP root (Vite 静的配信 + Socket.IO setup の
        # 両方を踏まないと 200 にならないため bootstrap 到達確認として最小)。
        # 外部入力 (github.event.*) は使わず固定文字列のみ参照。
        run: |
          set -euo pipefail
          APP="packages/desktop/release/mac-arm64/Ark.app"
          # 同一 runner で並列 step / 既存ファイルとの衝突を避けるため固定名は避ける。
          LOG=$(mktemp -t ark-smoke.log.XXXXXX)
          if [ ! -d "$APP" ]; then
            echo "::error::Ark.app not found at $APP"
            ls -la packages/desktop/release/ || true
            exit 1
          fi
          "$APP/Contents/MacOS/Ark" > "$LOG" 2>&1 &
          PID=$!
          echo "Started Ark (pid=$PID, log=$LOG)"

          # 異常終了経路でもプロセス残留させない (early exit / errexit / wait の
          # 戻り値が想定外でも cleanup 確実に走らせる)。
          # 順序: 生存判定 → TERM → poll → KILL → 最後に wait で reap する。
          # `wait` は生存中の子に対してブロックするので、必ず kill が先 (先に
          # wait すると HTTP smoke 成功後の trap 経路で永久待機する)。
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$PID" 2>/dev/null || true
            fi
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # bootstrap + server.listen に必要な時間 (Helper プロセス起動 + better-sqlite3
          # binding + paths 初期化 + Express bind)。GHA macos-14 は最大 60s で十分。
          # ループ内で early crash を検知し、60s 待たずに即 fail させる
          # (バグ (1) の Dynamic require は bootstrap 開始直後に throw するため)。
          PORT=""
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              # 実 exit code を確実に拾う: `|| true` を間に挟むと $? が常に 0 になる。
              # errexit 配下では non-zero で abort するので set +e で抑止する。
              set +e
              wait "$PID"
              EXIT_CODE=$?
              set -e
              echo "::error::Ark exited prematurely (exit=$EXIT_CODE) before server listen"
              END_TOKEN="ark-log-$(uuidgen)"
              echo "::stop-commands::${END_TOKEN}"
              echo "--- Ark stdout/stderr ---"
              cat "$LOG"
              echo "::${END_TOKEN}::"
              exit 1
            fi
            # awk 1 プロセスで抽出 (grep | head | grep の pipefail 不安定さを回避)。
            PORT=$(awk 'match($0, /Ark server running on http:\/\/localhost:[0-9]+/) {
              p=substr($0, RSTART, RLENGTH); sub(/.*:/, "", p); print p; exit
            }' "$LOG")
            if [ -n "$PORT" ]; then
              break
            fi
            sleep 1
          done

          if [ -z "$PORT" ]; then
            echo "::error::Server did not listen within 60s (likely bootstrap failure)"
            END_TOKEN="ark-log-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "--- Ark stdout/stderr ---"
            cat "$LOG"
            echo "::${END_TOKEN}::"
            exit 1
          fi
          # PORT のサニティチェック: 1..65535 でないなら ログ破損 / unexpected stdout。
          if ! [[ "$PORT" =~ ^[0-9]+$ ]] || [ "$PORT" -lt 1 ] || [ "$PORT" -gt 65535 ]; then
            echo "::error::Extracted port out of range: '$PORT' (expected 1..65535)"
            END_TOKEN="ark-log-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "--- Ark stdout/stderr ---"
            cat "$LOG"
            echo "::${END_TOKEN}::"
            exit 1
          fi
          echo "Server listening on port $PORT"

          # HTTP root の到達確認。--max-time で curl 自体を timeout させる。
          # exit code と http code を分離して保持する (`|| echo "000"` を `-w` の
          # 出力に連結すると "404000" 等の壊れた診断値になる)。
          set +e
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:$PORT/")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP" != "200" ]; then
            echo "::error::HTTP root returned http=$HTTP curl_exit=$CURL_EXIT (expected http=200 curl_exit=0)"
            # 依存 binary / app の stdout が workflow command (::warning:: 等) を
            # 含む可能性に備えて stop-commands で escape する。
            END_TOKEN="ark-log-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "--- Ark stdout/stderr ---"
            cat "$LOG"
            echo "::${END_TOKEN}::"
            exit 1
          fi
          echo "Bootstrap smoke passed (port=${PORT} http=${HTTP})"
          # cleanup は trap EXIT に委譲

      - name: Smoke test bundled SDK claude binary
        # PR #180 の root cause だった「SDK 付属 claude バイナリが asar 内パスで
        # spawn ENOTDIR」を防ぐため、`.unpacked` 配下に **実行ファイルとして** 配置
        # されていることを `--version` 起動で確認する。
        # `asarUnpack` ルール変更・SDK バージョン更新で binary 配置が変わった場合に
        # ここで fail する想定。Ark .app の target は darwin-arm64 のみのためパスは固定。
        # 外部入力 (github.event.*) は使わず固定文字列のみ参照。
        run: |
          set -euo pipefail
          BIN="packages/desktop/release/mac-arm64/Ark.app/Contents/Resources/app.asar.unpacked/node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/claude"
          if [ ! -x "$BIN" ]; then
            echo "::error::Bundled SDK claude binary missing or not executable: $BIN"
            ls -la "$(dirname "$BIN")" 2>&1 || echo "(directory not found)"
            exit 1
          fi
          # `--version` は network / auth 不要で即終了する safe な smoke 用 subcommand。
          # 壊れたバイナリ / dyld loader 問題で hang した場合に job timeout (60min) まで
          # 走らせないよう、background + sleep race で 15s で kill する。
          # macos runner には GNU `timeout` が無いので bash プリミティブで実装する。
          OUT_FILE=$(mktemp -t ark-claude-version.XXXXXX)
          "$BIN" --version > "$OUT_FILE" 2>&1 &
          BIN_PID=$!
          # killer 子プロセス: 15s で TERM、追加 3s 待っても残っていれば KILL を
          # 確実に強制する。TERM を無視するバイナリでも timeout を enforce できる。
          (
            sleep 15
            if kill -0 "$BIN_PID" 2>/dev/null; then
              kill -TERM "$BIN_PID" 2>/dev/null || true
              sleep 3
              kill -KILL "$BIN_PID" 2>/dev/null || true
            fi
          ) &
          KILLER_PID=$!
          # `if ! wait ...; then $?` だと `$?` が `!` 経由後の結果を拾ってしまう。
          # errexit 配下で wait の戻り値を直接取れるよう set +e/-e で挟む。
          set +e
          wait "$BIN_PID"
          BIN_EXIT=$?
          set -e
          kill "$KILLER_PID" 2>/dev/null || true
          wait "$KILLER_PID" 2>/dev/null || true
          if [ "$BIN_EXIT" -ne 0 ]; then
            echo "::error::Bundled SDK claude --version failed or timed out (exit=$BIN_EXIT)"
            # bundled binary 出力に workflow command が混入する可能性に備えて escape。
            END_TOKEN="ark-claude-version-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            cat "$OUT_FILE" 2>&1 || true
            echo "::${END_TOKEN}::"
            exit 1
          fi
          # 成功時の VERSION も plain stdout 上で workflow command として解釈
          # され得るため、stop-commands で囲んで escape する。
          VERSION=$(head -1 "$OUT_FILE")
          END_TOKEN="ark-claude-version-ok-$(uuidgen)"
          echo "::stop-commands::${END_TOKEN}"
          echo "Bundled SDK claude binary OK: ${VERSION}"
          echo "::${END_TOKEN}::"

      - name: Compute artifact metadata
        id: artifact
        # electron-builder 25 の macOS zip target はデフォルトで
        # `Ark-{version}-arm64-mac.zip` (`-mac` 接尾辞付き) を出力する。
        # 旧 glob `Ark-*-arm64.zip` ではこのファイル名にマッチせず
        # `ls: No such file or directory` で fail していたため、
        # `Ark-*-arm64-mac.zip` を期待値として明示する。
        # 同じディレクトリに `.blockmap` も生成されるが拡張子で除外される。
        # update-cask ジョブで Caskfile の sha256 を置換するために GITHUB_OUTPUT に書き込む。
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 期待 zip は 1 件のみ。0 件 or 2 件以上はビルド設定崩れの兆候として fail させる
          # (2 件以上を黙って先頭採用すると意図しない artifact の sha256 を Cask に流す)。
          ZIPS=(packages/desktop/release/Ark-*-arm64-mac.zip)
          if [[ "${#ZIPS[@]}" -eq 0 ]]; then
            echo "::error::Expected zip artifact not found in packages/desktop/release/"
            ls -la packages/desktop/release/ || true
            exit 1
          fi
          if [[ "${#ZIPS[@]}" -gt 1 ]]; then
            echo "::error::Multiple zip artifacts matched (count=${#ZIPS[@]}). 期待は 1 件のみ。"
            printf '  %s\n' "${ZIPS[@]}"
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          if [[ ! -f "${ZIP}" ]]; then
            echo "::error::Matched path is not a regular file: ${ZIP}"
            exit 1
          fi
          SHA=$(shasum -a 256 "${ZIP}" | awk '{print $1}')
          echo "zip=${ZIP}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Built ${ZIP} (sha256=${SHA})"

      - name: Upload to GitHub Releases
        # push trigger (tag) では release を新規作成し、zip を upload する。
        # workflow_dispatch では inputs.tag が空ならドライラン (upload skip)、
        # 指定があれば release を作成・上書きする。
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  # update-cask ジョブは別リポジトリ `<user>/homebrew-tap` の `Casks/ark.rb` を
  # 新リリースの version / sha256 に書き換える。HOMEBREW_TAP_TOKEN (PAT or
  # GitHub App token) が必要なため、secret 未設定でも release 自体は失敗
  # させない構造 (if: secrets が利用可能な時のみ実行) にする。
  #
  # F7 では雛形のみ。実有効化は別 repo 作成 + token 設定後に行う。
  # update-cask:
  #   name: Bump Cask in homebrew-tap
  #   needs: build
  #   if: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: dawidd6/action-homebrew-bump-formula@v4
  #       with:
  #         token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  #         tap: ignission/homebrew-tap
  #         formula: ark
  #         tag: ${{ inputs.tag || github.ref_name }}
