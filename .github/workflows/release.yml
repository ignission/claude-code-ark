name: release

# tag push (v*.*.*) で .app をビルドし、GitHub Releases に upload する。
# 別 repo (`<user>/homebrew-tap`) の Caskfile も自動更新する (要 HOMEBREW_TAP_TOKEN)。
#
# 前提:
#   - build-bin で tmux/ttyd の artifact が揃っている
#   - claude は @anthropic-ai/claude-code の platform package を .app へ同梱する
#     (runtime installer は廃止済み。main.ts の bootstrap が起動時に fail-fast で
#     app.asar.unpacked 配下の存在を要求する)
#   - F0:B-1 確定済み: Apple Developer 登録なし (未署名配布)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (branch or commit SHA). Tag を打つ前のドライラン用。"
        required: false
        default: ""
        type: string
      tag:
        description: "Release tag for upload (e.g. v0.1.0)。指定すると Release を作成・上書き、空ならドライラン (artifact のみ作成、upload skip)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # tmux / ttyd / 関連 OSS deps を arm64 native build し
  # ark-bin-macos-arm64 artifact を生成する依存ジョブ。
  # build-bin.yml の workflow_call トリガーで起動し、manifest.json hash で
  # actions/cache を共有するため、変更が無い限り 2 回目以降は高速 (~1 分)。
  build-bin:
    name: Build tmux/ttyd binaries
    uses: ./.github/workflows/build-bin.yml

  build:
    name: Build .app (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60
    # tmux/ttyd 同梱バイナリを取得した後でないと electron-builder が
    # extraResources で参照する build-assets/bin が空になり、配布した .app から
    # bundled tmux/ttyd が解決できなくなる (system PATH の Homebrew tmux に
    # 暗黙フォールバックして、非エンジニア向け配布の前提が崩れる) ため必須。
    needs: build-bin

    # update-cask ジョブから参照するメタデータ。
    # sha256 は Cask の sha256 値を更新するため必須。
    # zip_basename は zip filename が Cask の url パターン (Ark-{version}-arm64-mac.zip) と
    # 整合しているかを update-cask 側で再確認するために露出する。
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
      zip_basename: ${{ steps.artifact.outputs.zip_basename }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # push (tag) trigger: GITHUB_REF (refs/tags/...) が tag を指す → そのまま
          # workflow_dispatch: inputs.ref があれば branch/SHA、なければ caller ref。
          # inputs.tag を ref にしない (まだ存在しない可能性がある)。
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify tag matches package version
        # tag 経由の release で artifact 名 (Ark-<package.json.version>-arm64.zip) と
        # tag (v<X.Y.Z>) がずれると Cask の url / sha256 が解決できなくなるため、
        # 一致しない場合は build 前に fail させる。dry-run (inputs.tag 空) は skip。
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          # v 接頭辞を取り除いた値を semver として扱う
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./packages/desktop/package.json').version")
          if [[ "${TAG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::Tag (${TAG} → ${TAG_VERSION}) does not match packages/desktop/package.json version (${PKG_VERSION})."
            echo "::error::Bump packages/desktop/package.json version to ${TAG_VERSION} (or push the matching tag) before releasing."
            exit 1
          fi
          echo "::notice::Tag ${TAG} matches package version ${PKG_VERSION}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      # build-bin ジョブが upload した artifact (tmux / ttyd / Frameworks / licenses)
      # を packages/desktop/build-assets/ 直下に展開する。
      # electron-builder.yml の extraResources / extraFiles はここを参照する想定なので、
      # download 後はファイル系構造が以下になっている必要がある:
      #   packages/desktop/build-assets/bin/{tmux,ttyd}
      #   packages/desktop/build-assets/licenses/{INDEX.json, <pkg>/LICENSE}
      #   packages/desktop/build-assets/Frameworks/* (静的リンク済なら空)
      # artifact 名 (ark-bin-macos-arm64) は build-bin.yml の upload-artifact name と一致。
      - name: Download tmux/ttyd artifact
        uses: actions/download-artifact@v8
        with:
          name: ark-bin-macos-arm64
          path: packages/desktop/build-assets

      # actions/upload-artifact は zip 化の際に file mode を保持しないため、
      # download 後の tmux / ttyd は 644 (実行ビット無し) で展開される。
      # electron-builder はそのまま .app へ同梱するので、配布物から
      # bundled tmux/ttyd を exec できなくなる。ここで復元する。
      # 参照: https://github.com/actions/upload-artifact#permission-loss
      - name: Restore executable bit on bundled binaries
        run: chmod +x packages/desktop/build-assets/bin/tmux packages/desktop/build-assets/bin/ttyd

      # 同梱バイナリが揃っていることを electron-builder 起動前に assert する
      # (build-bin の verify step を二重チェック)。
      - name: Verify bundled binaries
        run: |
          set -euo pipefail
          for bin in tmux ttyd; do
            BIN_PATH="packages/desktop/build-assets/bin/${bin}"
            if [ ! -x "${BIN_PATH}" ]; then
              echo "::error::Bundled ${bin} missing or not executable at ${BIN_PATH}"
              ls -la packages/desktop/build-assets/bin/ || true
              exit 1
            fi
            file "${BIN_PATH}"
          done
          echo "::notice::Bundled tmux/ttyd ready for electron-builder"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web + server + desktop
        run: pnpm -r build

      - name: Package .app (arm64 zip)
        env:
          # F0:B-1 確定: 未署名配布 (Apple Developer 登録なし)。
          # electron-builder の auto signing を無効化し、identity 探索をスキップする。
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # target は electron-builder.yml の mac.target で dmg + zip を定義済み。
        # arch は CLI フラグ (--arm64) で渡す (electron-builder 25 の慣例的な指定)。
        # 旧コマンドは末尾に `zip` を位置引数として渡していたが、electron-builder 25 の
        # yargs は target 名を位置引数で受けず `Unknown argument: zip` で exit 1 する。
        # zip 成果物の欠落は下流 `Compute artifact metadata` step が
        # `ls packages/desktop/release/Ark-*-arm64.zip` で検出して fail する。
        run: pnpm --filter @ark/desktop exec electron-builder --mac --arm64

      - name: Smoke test .app bootstrap
        # PR #180 で fix した 2 系統のバグの regression を tag release 前に検知する:
        #   1. `Dynamic require of "electron" is not supported` (build.mjs banner 欠落) →
        #      bootstrap で main.js が throw、server.listen に到達できないので
        #      readiness probe がタイムアウト → step が exit 1
        #   2. 同梱 claude バイナリの asarUnpack 配置ずれ・実行権限欠落 → 次 step で検知
        # ヘルスチェック target は HTTP root (Vite 静的配信 + Socket.IO setup の
        # 両方を踏まないと 200 にならないため bootstrap 到達確認として最小)。
        # 外部入力 (github.event.*) は使わず固定文字列のみ参照。
        #
        # issue #181: 旧実装は stdout から `Ark server running on http://localhost:<port>`
        # を grep して PORT を抽出していたが、ログに偽 URL が混入すると runner 内
        # 別 listen process に curl してしまう抜けがあった。
        # ARK_PORT を fixed value で渡し、workflow 側も同じ値を直接 curl する経路に変更。
        # grep 経由の port 抽出を撤廃し、ログ依存リスクを低減。
        # (TOCTOU 残: lsof の事前確認後に別 process が同 port を掴むケースまでは保証外。
        # GHA runner の隔離性で実害は無視できる。)
        env:
          # 4042 は GHA macos runner のデフォルト listen 域 (3000 / 4000 / 5000 系)
          # と十分離れており、Vite dev / pnpm preview / monitoring agent 等との
          # 衝突を避けるため使用。値は workflow と smoke test だけで完結するため、
          # 別 step の固定値とは独立に変更可能。
          ARK_PORT: "4042"
        run: |
          set -euo pipefail
          APP="packages/desktop/release/mac-arm64/Ark.app"
          # 同一 runner で並列 step / 既存ファイルとの衝突を避けるため固定名は避ける。
          LOG=$(mktemp -t ark-smoke.log.XXXXXX)
          if [ ! -d "$APP" ]; then
            echo "::error::Ark.app not found at $APP"
            ls -la packages/desktop/release/ || true
            exit 1
          fi
          # ARK_PORT が main runner に既に listen している process と衝突していないかを
          # 起動前に検出する (検出時は CI を fail させて runner image 側の状況を可視化)。
          if lsof -nP -iTCP:"${ARK_PORT}" -sTCP:LISTEN >/dev/null 2>&1; then
            echo "::error::ARK_PORT=${ARK_PORT} は既に他プロセスが listen 中"
            lsof -nP -iTCP:"${ARK_PORT}" -sTCP:LISTEN || true
            exit 1
          fi
          "$APP/Contents/MacOS/Ark" > "$LOG" 2>&1 &
          PID=$!
          echo "Started Ark (pid=$PID, log=$LOG, ARK_PORT=${ARK_PORT})"

          # 異常終了経路でもプロセス残留させない (early exit / errexit / wait の
          # 戻り値が想定外でも cleanup 確実に走らせる)。
          # 順序: 生存判定 → TERM → poll → KILL → 最後に wait で reap する。
          # `wait` は生存中の子に対してブロックするので、必ず kill が先 (先に
          # wait すると HTTP smoke 成功後の trap 経路で永久待機する)。
          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$PID" 2>/dev/null || true
            fi
            wait "$PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          # readiness probe: 固定 ARK_PORT に対して curl で listen 到達を確認する。
          # bootstrap + server.listen に必要な時間 (Helper プロセス起動 +
          # better-sqlite3 binding + paths 初期化 + Express bind)。
          # GHA macos-14 は最大 60s で十分。ループ内で early crash を検知して
          # 60s 待たずに即 fail させる (Dynamic require 系のクラッシュは bootstrap
          # 開始直後に throw するため)。
          READY=0
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              # 実 exit code を確実に拾う: `|| true` を間に挟むと $? が常に 0 になる。
              # errexit 配下では non-zero で abort するので set +e で抑止する。
              set +e
              wait "$PID"
              EXIT_CODE=$?
              set -e
              echo "::error::Ark exited prematurely (exit=$EXIT_CODE) before server listen"
              END_TOKEN="ark-log-$(uuidgen)"
              echo "::stop-commands::${END_TOKEN}"
              echo "--- Ark stdout/stderr ---"
              cat "$LOG"
              echo "::${END_TOKEN}::"
              exit 1
            fi
            # --max-time 1 で 1 秒以内に応答が無ければ次の試行へ。
            # ready 判定は HTTP 200 を要求する: 4xx/5xx で curl exit 0 になっても
            # 部分初期化や誤配線を見逃すので、ここで bootstrap 完了 (= Vite 静的
            # 配信 + Socket.IO setup の両方が成立) まで踏み込む。次 step の最終
            # HTTP probe と一致した条件にすることで、ready ↔ smoke のずれを排除。
            set +e
            PROBE_HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 1 "http://localhost:${ARK_PORT}/" 2>/dev/null)
            PROBE_EXIT=$?
            set -e
            if [ "$PROBE_EXIT" -eq 0 ] && [ "$PROBE_HTTP" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "::error::Server did not listen on port ${ARK_PORT} within 60s (likely bootstrap failure)"
            END_TOKEN="ark-log-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "--- Ark stdout/stderr ---"
            cat "$LOG"
            echo "::${END_TOKEN}::"
            exit 1
          fi
          echo "Server listening on port ${ARK_PORT}"

          # PID-port binding 検証: 応答している listener が今起動した Ark 自身
          # (= $PID とその子プロセス群) であることを assert。
          # readiness probe が 200 を返したのに、その port を握っているのが
          # 別 process だった (Ark は別 port で listen / Ark は未 bind のまま
          # 生存し別 process が後から port を掴んだ) ケースを検知する。
          # Electron は Helper / Renderer 等で複数プロセスに分かれるため、
          # `$PID` 直下ではなく **同じ process group** に listen process が
          # いることを確認する (Ark は detached 起動していないので親 PID 由来)。
          # lsof 出力に PID 列があれば OK と判定する単純パターン。
          set +e
          BINDING=$(lsof -nP -iTCP:"${ARK_PORT}" -sTCP:LISTEN 2>/dev/null)
          set -e
          if [ -z "$BINDING" ]; then
            echo "::error::No listener on port ${ARK_PORT} after readiness probe (TOCTOU 経路)"
            exit 1
          fi
          # PID 列に $PID または同 process group の子 PID が含まれているか確認。
          # Electron の親 PID は $PID で、Helper は $PID から fork されるため
          # 同じ pgid。pgrep -g で当該 pgid 配下の全 PID を列挙する。
          PGID=$(ps -o pgid= -p "$PID" 2>/dev/null | tr -d ' ' || echo "")
          if [ -z "$PGID" ]; then
            echo "::error::Failed to resolve PGID for PID=$PID"
            exit 1
          fi
          ARK_PIDS=$(pgrep -g "$PGID" 2>/dev/null | tr '\n' '|' | sed 's/|$//')
          if [ -z "$ARK_PIDS" ]; then
            echo "::error::No PIDs in process group $PGID"
            exit 1
          fi
          # lsof 出力の 2 列目 (PID) を抽出し、ARK_PIDS のいずれかに一致するか確認。
          LISTENER_PID=$(echo "$BINDING" | awk 'NR>1 {print $2; exit}')
          if [ -z "$LISTENER_PID" ] || ! echo "$LISTENER_PID" | grep -qE "^(${ARK_PIDS})$"; then
            echo "::error::Port ${ARK_PORT} listener PID=${LISTENER_PID:-unknown} is not in Ark process group (pgid=$PGID, ark_pids=$ARK_PIDS)"
            echo "--- lsof output ---"
            echo "$BINDING"
            exit 1
          fi
          echo "Verified: port ${ARK_PORT} owned by Ark (listener PID=$LISTENER_PID, pgid=$PGID)"

          # HTTP root の到達確認 (binding 検証済の listener に対して 200 を再確認)。
          # --max-time で curl 自体を timeout させる。
          # exit code と http code を分離して保持する (`|| echo "000"` を `-w` の
          # 出力に連結すると "404000" 等の壊れた診断値になる)。
          set +e
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:${ARK_PORT}/")
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP" != "200" ]; then
            echo "::error::HTTP root returned http=$HTTP curl_exit=$CURL_EXIT (expected http=200 curl_exit=0)"
            # 依存 binary / app の stdout が workflow command (::warning:: 等) を
            # 含む可能性に備えて stop-commands で escape する。
            END_TOKEN="ark-log-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "--- Ark stdout/stderr ---"
            cat "$LOG"
            echo "::${END_TOKEN}::"
            exit 1
          fi
          echo "Bootstrap smoke passed (port=${ARK_PORT} http=${HTTP})"
          # cleanup は trap EXIT に委譲

      - name: Smoke test bundled tmux/ttyd binaries
        # issue #185: .app に同梱した tmux / ttyd が
        # `Resources/bin/` 配下で実行可能であることを確認する。
        # asarUnpack ルール変更・extraResources パス変更で binary 配置が崩れた場合に
        # ここで fail させる。version 出力で起動経路自体も smoke 検証する。
        # 同梱が無いと server 側の resolveTmuxPath は PATH の tmux に
        # 暗黙フォールバックするため、非エンジニア向け配布の前提が崩れる。
        run: |
          set -euo pipefail
          BIN_ROOT="packages/desktop/release/mac-arm64/Ark.app/Contents/Resources/bin"
          for tool in tmux ttyd; do
            BIN="${BIN_ROOT}/${tool}"
            if [ ! -x "${BIN}" ]; then
              echo "::error::Bundled ${tool} not found at ${BIN}"
              ls -la "${BIN_ROOT}" 2>&1 || echo "(bin directory not found)"
              exit 1
            fi
            file "${BIN}"
            # tmux は `-V`、ttyd は `--version`。両方とも network/auth 不要で即終了する safe な smoke。
            if [ "${tool}" = "tmux" ]; then
              VER=$("${BIN}" -V 2>&1 | head -1)
            else
              VER=$("${BIN}" --version 2>&1 | head -1)
            fi
            END_TOKEN="ark-${tool}-version-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            echo "Bundled ${tool} OK: ${VER}"
            echo "::${END_TOKEN}::"
          done

      - name: Smoke test bundled claude binary
        # PR #180 の root cause だった「同梱 claude バイナリが asar 内パスで
        # spawn ENOTDIR」を防ぐため、`.unpacked` 配下に **実行ファイルとして** 配置
        # されていることを `--version` 起動で確認する。
        # `asarUnpack` ルール変更・claude-code バージョン更新で binary 配置が変わった
        # 場合にここで fail する想定。Ark .app の target は darwin-arm64 のみ。
        #
        # 探索は main.ts の bootstrap fail-fast と同じ 2 レイアウト (flat / pnpm
        # isolated) を対象にする。パスを固定で書くと pnpm のバージョン付き
        # ディレクトリ名に追従できず、実体があるのに fail する。
        # 外部入力 (github.event.*) は使わず固定文字列のみ参照。
        run: |
          set -euo pipefail
          UNPACKED="packages/desktop/release/mac-arm64/Ark.app/Contents/Resources/app.asar.unpacked/node_modules"
          # arch は arm64 に限定する。darwin-x64 でも Rosetta 経由で --version は
          # 成功しうるため、緩い pattern だと bootstrap が要求する arm64 が
          # 欠落した成果物を通してしまう。
          #
          # 候補は bootstrap (main.ts) が実際に探索する 2 か所だけに限定する。
          # 別の依存配下にネストされたコピーを拾うと、bootstrap が見る位置には
          # 実体が無いのに smoke test だけ成功してしまう。
          #   1. flat:  <nm>/@anthropic-ai/claude-code-darwin-arm64/claude
          #   2. pnpm:  <nm>/.pnpm/@anthropic-ai+claude-code-darwin-arm64@*/node_modules/
          #             @anthropic-ai/claude-code-darwin-arm64/claude
          #
          # macOS runner の /bin/bash は 3.2 系なので mapfile (bash 4.0+) は使えない。
          # while read で配列へ積む。
          PKG="@anthropic-ai/claude-code-darwin-arm64"
          CANDIDATES=()
          FLAT="${UNPACKED}/${PKG}/claude"
          [ -f "$FLAT" ] && CANDIDATES+=("$FLAT")
          # .pnpm からの深さは <pkg>@<ver>/node_modules/@scope/<name>/claude = 5。
          # 固定することで、その下にさらにネストしたコピーを拾わない。
          while IFS= read -r line; do
            [ -n "$line" ] && CANDIDATES+=("$line")
          done < <(find "${UNPACKED}/.pnpm" -mindepth 5 -maxdepth 5 -type f -name claude \
            -path "*/node_modules/${PKG}/claude" 2>/dev/null | sort)
          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "::error::Bundled claude (darwin-arm64) not found at bootstrap-visible paths under ${UNPACKED}"
            ls -la "$UNPACKED/@anthropic-ai" 2>&1 || echo "(@anthropic-ai not unpacked)"
            ls -la "$UNPACKED/.pnpm" 2>&1 | head -20 || echo "(.pnpm not unpacked)"
            exit 1
          fi
          # flat / pnpm isolated のどちらか一方に 1 件だけあるのが期待レイアウト。
          # 複数出たら取り違えの可能性があるので明示的に fail させる。
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 bundled claude, found ${#CANDIDATES[@]}"
            printf '  %s\n' "${CANDIDATES[@]}"
            exit 1
          fi
          BIN="${CANDIDATES[0]}"
          if [ ! -x "$BIN" ]; then
            echo "::error::Bundled claude is not executable: $BIN"
            ls -la "$(dirname "$BIN")"
            exit 1
          fi
          echo "Found bundled claude: $BIN"
          # `--version` は network / auth 不要で即終了する safe な smoke 用 subcommand。
          # 壊れたバイナリ / dyld loader 問題で hang した場合に job timeout (60min) まで
          # 走らせないよう、background + sleep race で 15s で kill する。
          # macos runner には GNU `timeout` が無いので bash プリミティブで実装する。
          OUT_FILE=$(mktemp -t ark-claude-version.XXXXXX)
          "$BIN" --version > "$OUT_FILE" 2>&1 &
          BIN_PID=$!
          # killer 子プロセス: 15s で TERM、追加 3s 待っても残っていれば KILL を
          # 確実に強制する。TERM を無視するバイナリでも timeout を enforce できる。
          (
            sleep 15
            if kill -0 "$BIN_PID" 2>/dev/null; then
              kill -TERM "$BIN_PID" 2>/dev/null || true
              sleep 3
              kill -KILL "$BIN_PID" 2>/dev/null || true
            fi
          ) &
          KILLER_PID=$!
          # `if ! wait ...; then $?` だと `$?` が `!` 経由後の結果を拾ってしまう。
          # errexit 配下で wait の戻り値を直接取れるよう set +e/-e で挟む。
          set +e
          wait "$BIN_PID"
          BIN_EXIT=$?
          set -e
          kill "$KILLER_PID" 2>/dev/null || true
          wait "$KILLER_PID" 2>/dev/null || true
          if [ "$BIN_EXIT" -ne 0 ]; then
            echo "::error::Bundled claude --version failed or timed out (exit=$BIN_EXIT)"
            # bundled binary 出力に workflow command が混入する可能性に備えて escape。
            END_TOKEN="ark-claude-version-$(uuidgen)"
            echo "::stop-commands::${END_TOKEN}"
            cat "$OUT_FILE" 2>&1 || true
            echo "::${END_TOKEN}::"
            exit 1
          fi
          # 成功時の VERSION も plain stdout 上で workflow command として解釈
          # され得るため、stop-commands で囲んで escape する。
          VERSION=$(head -1 "$OUT_FILE")
          END_TOKEN="ark-claude-version-ok-$(uuidgen)"
          echo "::stop-commands::${END_TOKEN}"
          echo "Bundled claude binary OK: ${VERSION}"
          echo "::${END_TOKEN}::"

      - name: Compute artifact metadata
        id: artifact
        # electron-builder 25 の macOS zip target はデフォルトで
        # `Ark-{version}-arm64-mac.zip` (`-mac` 接尾辞付き) を出力する。
        # 旧 glob `Ark-*-arm64.zip` ではこのファイル名にマッチせず
        # `ls: No such file or directory` で fail していたため、
        # `Ark-*-arm64-mac.zip` を期待値として明示する。
        # 同じディレクトリに `.blockmap` も生成されるが拡張子で除外される。
        # update-cask ジョブで Caskfile の sha256 を置換するために GITHUB_OUTPUT に書き込む。
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 期待 zip は 1 件のみ。0 件 or 2 件以上はビルド設定崩れの兆候として fail させる
          # (2 件以上を黙って先頭採用すると意図しない artifact の sha256 を Cask に流す)。
          ZIPS=(packages/desktop/release/Ark-*-arm64-mac.zip)
          if [[ "${#ZIPS[@]}" -eq 0 ]]; then
            echo "::error::Expected zip artifact not found in packages/desktop/release/"
            ls -la packages/desktop/release/ || true
            exit 1
          fi
          if [[ "${#ZIPS[@]}" -gt 1 ]]; then
            echo "::error::Multiple zip artifacts matched (count=${#ZIPS[@]}). 期待は 1 件のみ。"
            printf '  %s\n' "${ZIPS[@]}"
            exit 1
          fi
          ZIP="${ZIPS[0]}"
          if [[ ! -f "${ZIP}" ]]; then
            echo "::error::Matched path is not a regular file: ${ZIP}"
            exit 1
          fi
          SHA256=$(shasum -a 256 "${ZIP}" | awk '{print $1}')
          ZIP_BASENAME=$(basename "${ZIP}")
          echo "zip=${ZIP}" >> "${GITHUB_OUTPUT}"
          echo "zip_basename=${ZIP_BASENAME}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Built ${ZIP} (sha256=${SHA256})"

      - name: Upload to GitHub Releases
        # push trigger (tag) では release を新規作成し、zip を upload する。
        # workflow_dispatch では inputs.tag が空ならドライラン (upload skip)、
        # 指定があれば release を作成・上書きする。
        if: ${{ github.event_name == 'push' || inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.artifact.outputs.zip }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  # update-cask は別リポジトリ `ignission/homebrew-tap` の `Casks/ark.rb` を
  # 新リリースの version / sha256 に書き換えて main に直接 commit する。
  #
  # 前提:
  #   - `ignission/homebrew-tap` に `Casks/ark.rb` が存在すること
  #     (v1.2.0 で初期版を手動 PR で投入済み)
  #   - claude-code-ark repo の secret `HOMEBREW_TAP_TOKEN` に
  #     ignission/homebrew-tap への write 権限を持つ PAT (fine-grained 推奨) を設定
  #
  # secret 未設定でも release 自体は失敗させないため、token チェックを
  # 第 1 step で行い、未設定時は後続 step を全て skip する。
  update-cask:
    name: Bump Cask in homebrew-tap
    needs: build
    # 入口条件: tag (refs/tags/v*) push、または workflow_dispatch で inputs.tag が指定された場合のみ。
    # 内部の TAG sanity check (`^v[0-9]+\.[0-9]+\.[0-9]+$`) と意図を揃え、想定外の起動経路で
    # `git push origin HEAD:main` まで進ませない。
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HOMEBREW_TAP_TOKEN is set
        id: token_check
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN が未設定のため、Cask 更新を skip します"
            echo "has_token=0" >> "${GITHUB_OUTPUT}"
          else
            echo "has_token=1" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout homebrew-tap
        if: steps.token_check.outputs.has_token == '1'
        uses: actions/checkout@v7
        with:
          repository: ignission/homebrew-tap
          # checkout 対象を publish 先と一致させる。tap 側の default branch
          # 変更やズレで意図しないブランチ内容を main に流し込むのを防ぐ。
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump version + sha256 in Casks/ark.rb
        if: steps.token_check.outputs.has_token == '1'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          ZIP_BASENAME: ${{ needs.build.outputs.zip_basename }}
        run: |
          set -euo pipefail
          # tag 形式の sanity check (v<X.Y.Z> のみ許容、sed 引数注入を防ぐ)
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected TAG format: ${TAG} (expected v<major>.<minor>.<patch>)"
            exit 1
          fi
          # sha256 は 64 桁 hex のみ許容
          if ! [[ "${SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected SHA256 format: ${SHA256}"
            exit 1
          fi
          VERSION="${TAG#v}"
          # zip basename が Cask の url パターンと整合していることを確認
          EXPECTED_BASENAME="Ark-${VERSION}-arm64-mac.zip"
          if [ "${ZIP_BASENAME}" != "${EXPECTED_BASENAME}" ]; then
            echo "::error::zip basename mismatch: got '${ZIP_BASENAME}', expected '${EXPECTED_BASENAME}'"
            echo "::error::Cask の url パターン (Ark-#{version}-arm64-mac.zip) が崩れている可能性あり"
            exit 1
          fi
          CASK="homebrew-tap/Casks/ark.rb"
          if [ ! -f "${CASK}" ]; then
            echo "::error::Cask not found: ${CASK}"
            exit 1
          fi
          # Cask の url 行に `Ark-#{version}-arm64-mac.zip` パターンが厳密に 1 件存在することを確認。
          # url テンプレートが壊れている / 別アーキ命名に変わっている / 複数 url 化されている場合は
          # version/sha256 だけ更新しても download URL が壊れたまま push されてしまうため、ここで防御する。
          URL_PATTERN_COUNT=$(grep -cF 'Ark-#{version}-arm64-mac.zip' "${CASK}" || true)
          if [ "${URL_PATTERN_COUNT}" != "1" ]; then
            echo "::error::Cask url の期待パターン 'Ark-#{version}-arm64-mac.zip' が ${URL_PATTERN_COUNT} 件 (期待: 1 件)"
            # ファイル全体を流出させず、関連行のみログに出す
            grep -E '^  (version|sha256|url)' "${CASK}" || true
            exit 1
          fi
          # 置換前に「version 行 / sha256 行が 1 件ずつ存在する」ことを assert。
          # 将来 multi-arch 化等で対象行が複数になった場合に一括置換で破壊するのを防ぐ。
          VERSION_BEFORE_COUNT=$(grep -cE '^  version "[^"]*"$' "${CASK}" || true)
          SHA_BEFORE_COUNT=$(grep -cE '^  sha256 "[^"]*"$' "${CASK}" || true)
          if [ "${VERSION_BEFORE_COUNT}" != "1" ]; then
            echo "::error::Cask に version 行が ${VERSION_BEFORE_COUNT} 件 (期待: 1 件)"
            # ファイル全体を流出させず、関連行のみログに出す
            grep -E '^  (version|sha256|url)' "${CASK}" || true
            exit 1
          fi
          if [ "${SHA_BEFORE_COUNT}" != "1" ]; then
            echo "::error::Cask に sha256 行が ${SHA_BEFORE_COUNT} 件 (期待: 1 件)"
            # ファイル全体を流出させず、関連行のみログに出す
            grep -E '^  (version|sha256|url)' "${CASK}" || true
            exit 1
          fi
          # downgrade 防止: 現 Cask version <= 新 VERSION でなければ拒否。
          # 同 version (idempotent rerun) は許容し、commit step の git diff --cached --quiet
          # で no-op skip される。
          CURRENT_VERSION=$(grep -E '^  version "[^"]*"$' "${CASK}" | sed -E 's/^  version "([^"]*)"$/\1/')
          if ! printf '%s\n%s\n' "${CURRENT_VERSION}" "${VERSION}" | sort -V -C; then
            echo "::error::version downgrade を拒否: 現 Cask=${CURRENT_VERSION}, 新 VERSION=${VERSION}"
            exit 1
          fi
          # GNU sed (ubuntu-latest)。`  version "..."` と `  sha256 "..."` の 2 行を置換。
          sed -i -E "s/^(  version )\".*\"\$/\\1\"${VERSION}\"/" "${CASK}"
          sed -i -E "s/^(  sha256 )\".*\"\$/\\1\"${SHA256}\"/" "${CASK}"
          # Assertive: 置換後に期待値の行が 1 件存在することを fixed-string 一致で検証
          # (-Fx で行全体の固定文字列一致。VERSION 中の `.` が正規表現メタとして解釈
          # されることを防ぐ)。
          VERSION_AFTER_COUNT=$(grep -cFx "  version \"${VERSION}\"" "${CASK}" || true)
          SHA_AFTER_COUNT=$(grep -cFx "  sha256 \"${SHA256}\"" "${CASK}" || true)
          if [ "${VERSION_AFTER_COUNT}" != "1" ] || [ "${SHA_AFTER_COUNT}" != "1" ]; then
            echo "::error::Cask 更新後の検証失敗 (version=${VERSION_AFTER_COUNT} sha256=${SHA_AFTER_COUNT})"
            # ファイル全体を流出させず、関連行のみログに出す
            grep -E '^  (version|sha256|url)' "${CASK}" || true
            exit 1
          fi
          echo "::notice::Cask bumped to ${VERSION} (sha256=${SHA256})"

      - name: Commit + push to homebrew-tap main
        if: steps.token_check.outputs.has_token == '1'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CASK="Casks/ark.rb"
          # Cask の invariant を post-rebase でも再検証するための共通関数。
          # 並行更新で remote 側の `url` テンプレや構造が変わった場合に、当初の前提が
          # 崩れた状態で push しないようリトライ毎に呼び出す。
          assert_cask_invariants() {
            local url_count version_count sha_count
            url_count=$(grep -cF 'Ark-#{version}-arm64-mac.zip' "${CASK}" || true)
            version_count=$(grep -cFx "  version \"${VERSION}\"" "${CASK}" || true)
            sha_count=$(grep -cFx "  sha256 \"${SHA256}\"" "${CASK}" || true)
            if [ "${url_count}" != "1" ] || [ "${version_count}" != "1" ] || [ "${sha_count}" != "1" ]; then
              echo "::error::Cask invariant 違反 (url=${url_count} version=${version_count} sha256=${sha_count})"
              grep -E '^  (version|sha256|url)' "${CASK}" || true
              return 1
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${CASK}"
          if git diff --cached --quiet; then
            echo "::notice::Cask に差分なし (既に ${VERSION} が反映済み)。push を skip"
            exit 0
          fi
          git commit -m "chore: Bump ark Cask to ${VERSION}"
          # tap main が並行更新されると非 fast-forward で push が落ちるため、
          # pull --rebase で同期してから push を最大 3 回まで再試行する。
          # autostash は無用なローカル差分が無い前提だが、保険として有効化。
          # rebase 後は invariant が崩れていないかを再検証し、崩れていれば abort。
          # push 失敗のうち non-fast-forward 系のみリトライ対象とする。
          # 認可不備 / branch protection / token 権限不足 / ネットワーク断などの非リトライ系で
          # pull --rebase を走らせると原因をぼかすため、stderr から rejection 種別を判定する。
          MAX_ATTEMPTS=3
          PUSH_LOG=$(mktemp)
          for attempt in $(seq 1 ${MAX_ATTEMPTS}); do
            if git push origin HEAD:main 2> "${PUSH_LOG}"; then
              echo "::notice::push 成功 (attempt=${attempt})"
              exit 0
            fi
            cat "${PUSH_LOG}" >&2
            if ! grep -qE '(non-fast-forward|fetch first|stale info|rejected)' "${PUSH_LOG}"; then
              echo "::error::push が non-fast-forward 以外のエラーで失敗 (認可・権限・接続を確認)"
              exit 1
            fi
            if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
              echo "::warning::push 失敗 (attempt=${attempt}, NFF 系) - pull --rebase で同期して再試行"
              if ! git pull --rebase --autostash origin main; then
                echo "::error::pull --rebase でコンフリクトが解消できず abort"
                git rebase --abort 2>/dev/null || true
                exit 1
              fi
              # rebase 後の作業ツリーで Cask invariant を再確認 (codex [高] 指摘対応)
              if ! assert_cask_invariants; then
                echo "::error::pull --rebase 後に Cask invariant 違反、abort"
                exit 1
              fi
            fi
          done
          echo "::error::push が ${MAX_ATTEMPTS} 回連続で失敗"
          exit 1
