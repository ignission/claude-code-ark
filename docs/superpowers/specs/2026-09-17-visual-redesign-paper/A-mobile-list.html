<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  /* A: Paper — 紙と付箋 (モバイル一覧 / ライト) */
  :root {
    --background: oklch(0.985 0.005 80);
    --foreground: oklch(0.24 0.02 60);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.24 0.02 60);
    --muted: oklch(0.955 0.008 80);
    --muted-foreground: oklch(0.48 0.02 60);
    --primary: oklch(0.50 0.16 262);
    --primary-foreground: oklch(0.99 0 0);
    --border: oklch(0.90 0.01 80);
    --status-busy: oklch(0.52 0.14 240);
    --status-idle: oklch(0.55 0.15 150);
    --status-awaiting: oklch(0.56 0.15 70);
    --status-error: oklch(0.55 0.20 25);
    --status-stopped: oklch(0.55 0.015 60);
    --shadow-card: 0 1px 2px oklch(0 0 0 / 0.06), 0 4px 12px oklch(0 0 0 / 0.05);
    --font-sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--background); }
  .root {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--background);
    color: var(--foreground);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex: none; }

  .header {
    display: flex;
    align-items: center;
    height: 56px;
    padding: 0 8px 0 20px;
    flex: none;
  }
  .wordmark {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--foreground);
  }
  .icon-btn svg { width: 22px; height: 22px; }

  .list {
    flex: 1;
    min-height: 0;
    padding: 4px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow: hidden;
  }
  .section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 28px;
    padding: 0 4px;
    margin-bottom: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted-foreground);
  }
  .badge {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--status-awaiting);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
  }
  .card {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
  }
  .card + .card { margin-top: 8px; }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .card-name {
    flex: 1;
    min-width: 0;
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-time { font-size: 12px; font-weight: 500; color: var(--muted-foreground); flex: none; }
  .card-sub {
    display: block;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted-foreground);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub .branch { color: var(--foreground); opacity: 0.8; }
  .card-sub .dot { margin: 0 5px; }
  .card.quiet { box-shadow: none; background: transparent; }
  .card.quiet .card-name { color: var(--muted-foreground); }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    padding: 0 8px 0 6px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    flex: none;
    color: var(--tone);
    background: color-mix(in oklch, var(--tone) 14%, transparent);
  }
  .chip svg { width: 13px; height: 13px; }
  .chip.awaiting { --tone: var(--status-awaiting); }
  .chip.idle { --tone: var(--status-idle); }
  .chip.busy { --tone: var(--status-busy); }
  .chip.error { --tone: var(--status-error); }
  .chip.stopped { --tone: var(--status-stopped); }

  .dots { display: inline-flex; gap: 2px; width: 13px; justify-content: center; }
  .dots i {
    width: 3px; height: 3px; border-radius: 50%;
    background: currentColor;
    display: inline-block;
    animation: breathe 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes breathe { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 0.7; } }
</style>
</head>
<body>
<div class="root" style="width: 390px; height: 844px; overflow: hidden;">

  <header class="header">
    <h1 class="wordmark">Ark</h1>
    <button class="icon-btn" aria-label="新規セッション">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>

  <div class="list">
    <section>
      <div class="section-head"><span>あなたの番</span><span class="badge">2</span></div>
      <button class="card">
        <span class="card-top">
          <span class="chip awaiting"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.1 1-1.1 1.8"/><path d="M12 17h.01"/></svg>質問</span>
          <span class="card-name">recipe-app</span>
          <span class="card-time">2分前</span>
        </span>
        <span class="card-sub"><span class="branch">main</span><span class="dot">·</span>ログイン画面のデザインはどちらにしますか？</span>
      </button>
      <button class="card">
        <span class="card-top">
          <span class="chip idle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>完了</span>
          <span class="card-name">team-site</span>
          <span class="card-time">12分前</span>
        </span>
        <span class="card-sub"><span class="branch">feature/news-page</span><span class="dot">·</span>お知らせページを追加しました。プレビューで確認できます</span>
      </button>
    </section>

    <section>
      <div class="section-head"><span>作業中</span></div>
      <button class="card">
        <span class="card-top">
          <span class="chip busy"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>作業中</span>
          <span class="card-name">invoice-tool</span>
          <span class="card-time">今</span>
        </span>
        <span class="card-sub"><span class="branch">main</span><span class="dot">·</span>テストを実行しています</span>
      </button>
      <button class="card">
        <span class="card-top">
          <span class="chip busy"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>作業中</span>
          <span class="card-name">ark</span>
          <span class="card-time">今</span>
        </span>
        <span class="card-sub"><span class="branch">fix/reconnect</span><span class="dot">·</span>ファイルを読んでいます</span>
      </button>
    </section>

    <section>
      <div class="section-head"><span>休止中</span></div>
      <button class="card">
        <span class="card-top">
          <span class="chip error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/></svg>問題</span>
          <span class="card-name">photo-sync</span>
          <span class="card-time">1時間前</span>
        </span>
        <span class="card-sub"><span class="branch">main</span><span class="dot">·</span>ビルドに失敗しました</span>
      </button>
      <button class="card quiet">
        <span class="card-top">
          <span class="chip stopped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/></svg>停止</span>
          <span class="card-name">notes</span>
          <span class="card-time">昨日</span>
        </span>
        <span class="card-sub"><span class="branch">main</span></span>
      </button>
    </section>
  </div>

</div>
</body>
</html>
